spring.config.import=optional:file:.env,optional:file:./.env,optional:file:../.env

# ================================

# Database Configuration

# ================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================

# JPA / Hibernate Configuration

# ================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ================================

# Email Configuration

# ================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# ================================

# Server Configuration

# ================================

server.address=0.0.0.0
server.port=${PORT:8081}

# ================================

# Logging Configuration

# ================================

logging.level.com.buildpro=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# ================================

# Error Handling

# ================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ================================

# Thymeleaf Configuration

# ================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================

# OpenAPI / Swagger Configuration

# ================================

springdoc.api-docs.path=${API_DOCS_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.tagsSorter=${SWAGGER_TAG_SORTER:alpha}
springdoc.swagger-ui.operationsSorter=${SWAGGER_OPERATION_SORTER:alpha}

# ================================

# Google Gemini AI Configuration

# ================================

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ================================

# Razorpay Configuration

# ================================

razorpay.key.id=${RAZORPAY_KEY}
razorpay.key.secret=${RAZORPAY_SECRET}

# ================================

# JWT Token Secret

# ================================

jwt.secret=${JWT_SECRET}

# ================================

# Mapbox Settings

# ================================

mapbox.access.token=${MAPBOX_ACCESS_TOKEN:}

# ================================

# SSL / Reverse Proxy Configuration

# ================================

server.forward-headers-strategy=framework
